name: F-Droid downloads badge

on:
  schedule:
    - cron: '17 6 * * *' # daily; F-Droid publishes metrics weekly
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fdroid-downloads-badge
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch previously published stats
        run: |
          git fetch origin badges --depth=1 || true
          git show origin/badges:fdroid-stats.json > /tmp/previous.json 2>/dev/null || echo '{}' > /tmp/previous.json

      - name: Count downloads
        run: |
          mkdir -p out
          python .github/scripts/fdroid_downloads.py out/fdroid-downloads.json out/fdroid-stats.json /tmp/previous.json

      - name: Publish to badges branch
        run: |
          if git show origin/badges:fdroid-stats.json 2>/dev/null | cmp -s - out/fdroid-stats.json; then
            echo "No change."
            exit 0
          fi
          cd out
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Update F-Droid downloads badge"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" badges
